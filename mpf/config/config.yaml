playfields:
  playfield:
    tags: default
    default_source_device: plunger

flippers:
  left_flipper:
    main_coil: c_flipper_left_main
    hold_coil: c_flipper_left_hold
    activation_switch: s_left_flipper
  right_flipper:
    main_coil: c_flipper_right_main
    hold_coil: c_flipper_right_hold
    activation_switch: s_right_flipper
  right_upper_flipper:
    main_coil: c_flipper_upper_main
    hold_coil: c_flipper_upper_hold
    activation_switch: s_right_flipper

ball_devices:
  trough:
    ball_switches: s_trough1, sw32, sw33, sw34, sw35, sw36, s_trough_jam
    eject_coil: c_trough_eject
    tags: trough, home, drain
    jam_switch: s_trough_jam
    eject_coil_jam_pulse: 15ms
    eject_targets: plunger
    debug: true
  plunger:
    ball_switches: sw52
    eject_coil: c_plunger
    player_controlled_eject_event: s_launch_button_active
    eject_targets: playfield
    eject_timeouts: 3s
    debug: true
  race_scoop:
    ball_switches: sw56
    eject_coil: c_race_scoop
    eject_targets: playfield
    eject_timeouts: 1s
    debug: true
  shortcut_scoop:
    ball_switches: sw58
    eject_coil: c_shortcut_scoop
    eject_targets: playfield
    eject_timeouts: 1s
    debug: true
  lock_vuk:
    ball_switches: sw95
    eject_coil: c_lock_vuk
    eject_targets: playfield
    eject_timeouts: 1s
    debug: true
  left_vuk:
    ball_switches: sw97
    eject_coil: c_left_vuk
    eject_targets: playfield
    eject_timeouts: 1s
    debug: true
  center_vuk:
    ball_switches: sw96
    eject_coil: c_center_vuk
    eject_targets: playfield
    eject_timeouts: 1s
    debug: true
  
light_settings:
  color_correction_profiles:
    NeoSeg_red:
      whitepoint: [.8, .8, .8]
    NeoSeg_white:
      whitepoint: [.55, .55, .55]
    NeoSeg_blue:
      whitepoint: [.5, .5, .5]
    NeoSeg_orange:
      whitepoint: [.9, .9, .9]
    NeoSeg_yellow:
      whitepoint: [1, 1, 1]
    NeoSeg_green:
      whitepoint: [.5, .5, .5]


